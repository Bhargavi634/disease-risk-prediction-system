<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Risk Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
  <h2>Risk Result</h2>
  <div class="card p-3">
    <p>Condition: <strong th:text="${result.condition}">Condition</strong></p>
    <p>Risk: <strong th:text="${result.risk}">low</strong></p>
    <p>Score: <span th:text="${result.score}">0.0</span></p>
    <p class="text-danger">Suggestion: Consult a doctor for further evaluation.</p>
  </div>
  <a href="/profile" class="btn btn-link mt-3">Back to profile</a>
</body>
</html>
