<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
  <h2>Register</h2>
  <form method="post" action="/register">
    <div class="mb-3"><label>Username</label><input class="form-control" name="username" required></div>
    <div class="mb-3"><label>Password</label><input class="form-control" name="password" type="password" required></div>
    <div class="mb-3"><label>Full name</label><input class="form-control" name="fullName"></div>
    <div class="mb-3"><label>Age</label><input class="form-control" name="age" type="number"></div>
    <div class="mb-3"><label>Gender</label><select class="form-select" name="gender"><option>male</option><option>female</option></select></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <button class="btn btn-success">Register</button>
  </form>
</body>
</html>
