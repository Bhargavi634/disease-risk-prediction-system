<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
  <h2>Welcome, <span th:text="${user.fullName} ?: ${user.username}">User</span></h2>
  <p>Age: <span th:text="${user.age}">0</span> | Gender: <span th:text="${user.gender}">-</span></p>
  <a class="btn btn-primary" href="/diabetes">Diabetes Questionnaire</a>
  <a class="btn btn-warning" href="/heart">Heart Attack Questionnaire</a>
  <a class="btn btn-secondary" href="/logout">Logout</a>
</body>
</html>
